name: Deploy

on:
  push:
    branches:
      - staging

  workflow_dispatch:
    inputs:
      env:
        description: "Environnement"
        required: true
        type: choice
        options:
          - staging
          - production
          
jobs:
  webpack:
    name: Webpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "21"
          cache: "npm"

      - name: Install node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          WEBPUSH_PUBLIC_KEY: "${{ secrets.WEBPUSH_PUBLIC_KEY }}"
          SENTRY_ENV: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

      - name: Print build asset tree
        run: tree -L 3 assets/

      - name: Zip assets
        run: |
          cd assets
          zip -r ../agir-assets.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: agir-assets.zip
          overwrite: true

      - name: Tell the team
        run: curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=Build%20${{ github.ref_name || inputs.environment }}%20terminé"

  sentry:
    name: Create Sentry release
    needs: webpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_LOG_LEVEL: debug
        with:
          ignore_missing: true
          finalize: false
          environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
          projects: ${{ secrets.SENTRY_PROJECT_BACK }} ${{ secrets.SENTRY_PROJECT_FRONT }}

  deploy-staging:
    if: github.ref_name != 'production'
    environment: preprod
    name: Deploy to staging
    needs: sentry
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          owner: 'lafranceinsoumise'
          repository: 'playbooks'
          branch: 'master'
          access-token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Setup Ansible
        uses: alex-oleshkevich/setup-ansible@v1.0.1
        with:
          version: 11.7.0

      - name: Setup SSH key
        run: |
          cd playbooks
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts

      - name: Setup Vault password
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > playbooks/.vault-pass
          chmod 600 playbooks/.vault-pass

      - name: Download a Build Artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: assets
          path: ./

      - name: Run Ansible Playbook
        run: |
          cd playbooks
          ansible-playbook agir.yml \
            --tags deploy,ci \
            --skip-tags manual \
            --limit agir-preprod \
            --vault-password-file .vault-pass \
            --private-key ~/.ssh/id_rsa
  e2e-tests:
    environment: preprod
    name: Run E2E tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  deploy-production:
    if: github.ref_name == 'production'
    environment: prod
    name: Deploy to production
    needs: sentry
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          owner: 'lafranceinsoumise'
          repository: 'playbooks'
          branch: 'master'
          access-token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Setup Ansible
        uses: alex-oleshkevich/setup-ansible@v1.0.1
        with:
          version: 11.7.0

      - name: Setup SSH key
        run: |
          cd playbooks
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts

      - name: Setup Vault password
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > playbooks/.vault-pass
          chmod 600 playbooks/.vault-pass

      - name: Download a Build Artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: assets
          path: ./

      - name: Run Ansible Playbook
        run: |
          cd playbooks
          ansible-playbook agir.yml \
            --tags deploy,ci \
            --skip-tags manual \
            --limit agir-prod \
            --vault-password-file .vault-pass \
            --private-key ~/.ssh/id_rsa
