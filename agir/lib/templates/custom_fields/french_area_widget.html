{% load static %}
{% include "gis/admin/osm.html" %}

<div style="display: flex;flex-direction: column;">
    <div class="form-row">
      <label><p>Ajouter une circonscription à la sélection&nbsp;:</p>
        <select id="french-circo-area-widget-select-1">
          <option></option>
        </select><br/>
        <button id="french-circo-area-widget-button-1" class="button">Ajouter</button>
      </label>
    </div>

    <div class="form-row">
      <label><p>Ajouter un département, une région ou un arrondissement à la sélection&nbsp;:</p>
        <select id="french-area-widget-select-1">
          <option></option>
        </select><br/>
        <button id="french-area-widget-button-1" class="button">Ajouter</button>
      </label>
      <div class="help">Mais en vrai vous ne devriez pas en avoir besoin, utilisez le filtre par code postal.</div>
    </div>
    <div class="form-row">
      <label style="width: auto;"><p>Ajouter une commune à la sélection&nbsp;:</p>
        <select id="french-area-widget-select-2" style="width: 150px;"></select><br/>
        <button id="french-area-widget-button-2" class="button">Ajouter</button>
      </label><br/>
    </div>
</div>
<script>
(function($) {
    var geojson_format = new OpenLayers.Format.GeoJSON({
      internalProjection: new OpenLayers.Projection("EPSG:900913"),
      externalProjection: new OpenLayers.Projection("EPSG:4326")
    });

    function addToField(feature) {
      if (feature.geometry instanceof OpenLayers.Geometry.Polygon) {
        feature.geometry = new OpenLayers.Geometry.MultiPolygon([feature.geometry]);
      }
      // If geometry collection, add each component individually so they may be
      // edited individually.
      for (var i = 0; i < feature.geometry.components.length; i++) {
          {{ module }}.layers.vector.addFeatures([new OpenLayers.Feature.Vector(feature.geometry.components[i].clone())]);
      }

      {{ module }}.add_wkt(null);

      // Zooming to the bounds.
      {{ module }}.map.zoomToExtent({{ module }}.layers.vector.getDataExtent());
    }


    var $select1 = $("#french-area-widget-select-1");
    var $button1 = $("#french-area-widget-button-1");
    var $select2 = $("#french-area-widget-select-2");
    var $button2 = $("#french-area-widget-button-2");

    const $selectCirco = $("#french-circo-area-widget-select-1")
    const $buttonCirco = $("#french-circo-area-widget-button-1")

    $.when(
      $.getJSON("{% static "lib/circonscriptions-legislatives-p20.geojson" %}")
    ).then((circos) => {
      const features = circos.features;

      features.forEach((feat, index) => {
        $selectCirco.append($("<option></option>").attr("value", index).text(`${feat.properties.nomDepartement} ${feat.properties.nomCirconscription}`))
      })

      $selectCirco.select2()
      $buttonCirco.click((e) => {
        e.preventDefault();
        const feature = geojson_format.read(features[$selectCirco.val()], "Feature");
        $selectCirco.val(null).trigger("change");
        addToField(feature)
      })
    })

    $.when(
      $.getJSON("{% static "lib/regions-100m.geojson" %}"),
      $.getJSON("{% static "lib/departements-100m.geojson" %}"),
      $.getJSON("{% static "lib/arrondissements_paris.geojson" %}"),
      $.getJSON("{% static "lib/arrondissements_marseille.geojson" %}"),
      $.getJSON("{% static "lib/arrondissements_lyon.geojson" %}"),
    ).then(function(dataRegions, dataDepartements, arrondissementsParis, arrondissementsMarseille, arrondissementsLyon) {
      const features = dataRegions[0].features
        .concat(dataDepartements[0].features)
        .concat(arrondissementsParis[0].features)
        .concat(arrondissementsMarseille[0].features)
        .concat(arrondissementsLyon[0].features);
      $.each(features, function(key, feature) {
          $select1.append($("<option></option>").attr("value", key).text(feature.properties.nom ?? feature.properties.com_arm_name?.[0]));
      });

      $select1.select2();
      $button1.click(function (e) {
        e.preventDefault();
        const feature = geojson_format.read(features[$select1.val()], "Feature");
        $select1.val(null).trigger("change");
        addToField(feature);
      });
    });

    var geoApiResults;
    $select2.select2({
      ajax: {
        url: "https://geo.api.gouv.fr/communes",
        data: function(params) {
          return {
            nom: params.term,
            fields: "contour,departement",
            limit: 10
          }
        },
        processResults: function (data) {
          geoApiResults = data;
          var results = $.map(data, function(item, key) {
            return {
              id: key + 1,
              text: item.nom + " (" + item.departement.code + ")",
              geometry: item.contour
            };
          });
          return {results: results};
        }
      }
    });

    $button2.click(function (e) {
      e.preventDefault();
      var feature = geojson_format.read({
        type: "Feature",
        geometry: $select2.select2('data')[0].geometry,
        properties: {}
      }, "Feature");
      $select2.val(null).trigger("change");
      addToField(feature);
    });
})(django.jQuery);

</script>
