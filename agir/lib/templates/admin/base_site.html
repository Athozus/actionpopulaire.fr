{% extends "admin/base_site.html" %}

{% load static %}

{% block extrastyle %}
  {% if production_colors %}
    <link rel="stylesheet" type="text/css" href="{% static "admin/prod_colors.css" %}"/>
  {% else %}
    <link rel="stylesheet" type="text/css" href="{% static "admin/staging_colors.css" %}"/>
  {% endif %}
  <link rel="stylesheet" type="text/css" href="{% static "admin/spinner.css" %}"/>
    <style>
    .form-row .widget-limit-max-height {
      max-height: 250px;
      overflow-x: auto;
      display: inline-block;
      margin-left: 0;
    }
    .help {
      font-size: 0.88rem !important;
    }
  </style>
{% endblock %}
{% block extrahead %}
  {{ block.super }}
  <script src="{% static 'admin/js/htmx.min.js' %}" defer></script>
{% endblock %}
